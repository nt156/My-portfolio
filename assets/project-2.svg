  <rect x="420" y="640" width="360" height="4" fill="#c9a227"/>
  <rect x="380" y="730" width="440" height="22" fill="#211e1a"/>
  <!-- lotus petals -->
  <g fill="none" stroke="#e8e2d4" stroke-width="3">
    <path d="M600 640 C 520 560, 520 430, 600 330 C 680 430, 680 560, 600 640 Z"/>
    <path d="M600 640 C 470 610, 400 500, 420 370 C 540 430, 590 540, 600 640 Z"/>
